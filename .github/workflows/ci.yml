name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline
        timeout-minutes: 10

      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - name: Audit dependencies
        shell: bash
        run: |
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            if timeout 120s npm audit --audit-level=high; then
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "::warning::npm audit attempt $attempt/$max_attempts failed; retrying in 20 seconds."
              sleep 20
            fi
          done

          echo "::error::npm audit failed after $max_attempts attempts."
          exit 1

      - name: Run release gate
        run: npm run verify:final

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
